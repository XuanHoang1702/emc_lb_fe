name: CI

# Chạy trên mọi PR hướng vào main/develop và mọi push vào main/develop
# Không cho phép bỏ qua bước nào — mọi job đều bắt buộc (required check trên GitHub)
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Huỷ các lần chạy cũ hơn của cùng 1 PR khi có commit mới, tránh lãng phí runner
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quyền tối thiểu — nguyên tắc least privilege
permissions:
  contents: read
  actions: write # cần để upload/download build artifact giữa các job (download-artifact@v4 cần actions: read)
  pull-requests: write # để comment coverage report lên PR

env:
  NODE_VERSION: '20.x'
  # Bắt buộc CI fail nếu có warning khi build (không cho "warning trôi qua")
  CI: true

jobs:
  # ============================================================
  # JOB 0: Cài đặt dependencies và cache
  # ============================================================
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần full history để turbo tính affected chính xác

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (frozen lockfile — không cho tự ý update)
        run: npm ci

      # Cache Turbo với key thống nhất để downstream jobs restore được
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

  # ============================================================
  # JOB 1: Lint — ESLint + Prettier check
  # Zero warnings allowed
  # ============================================================
  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # --max-warnings 0: bất kỳ warning nào cũng làm fail job, không riêng error
      - name: ESLint (zero warnings policy)
        run: npx turbo run lint -- --max-warnings=0

      - name: Prettier format check
        run: npm run format:check

      - name: Check for banned patterns (console.log, debugger, .only trong test)
        run: |
          if grep -rn --include="*.ts" --include="*.tsx" \
            -E "console\.(log|debug)|debugger;|\.only\(" \
            --exclude-dir={node_modules,dist,.next,.turbo} apps/ packages/ 2>/dev/null; then
            echo "::error::Phát hiện console.log/debugger/.only còn sót lại trong code. Chặn merge."
            exit 1
          fi

  # ============================================================
  # JOB 2: Type check — strict mode, không cho phép 'any' ngầm
  # ============================================================
  typecheck:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # tsconfig bật: strict, noUnusedLocals, noUnusedParameters, noUncheckedIndexedAccess
      - name: TypeScript strict check
        run: npx turbo run type-check

  # ============================================================
  # JOB 3: Unit + Integration test — coverage threshold cứng
  # Vitest built-in coverage thresholds — fail nếu dưới ngưỡng
  # ============================================================
  test:
    name: Unit & Integration Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # Chạy test + coverage cho toàn bộ monorepo
      # Coverage thresholds được enforce trong vitest.config.ts của mỗi package
      - name: Run tests with coverage
        run: npx turbo run test -- --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 7

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Coverage report')
            );
            const body = 'Coverage report đã pass ngưỡng tối thiểu (statements 80%, branches 75%, functions 80%, lines 80%).';
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  # ============================================================
  # JOB 4: Build — đảm bảo build production thành công, không warning
  # ============================================================
  build:
    name: Build (${{ matrix.app }})
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [storefront, admin]
        include:
          # Storefront build ra .next (Next.js), admin build ra dist (Vite)
          # Upload nhiều path để LCA = apps/storefront, artifact giữ cấu trúc .next/ và public/
          # (giống e2e.yml) — nếu upload 1 path, .next bị flatten và next start không tìm thấy build
          # Loại trừ .next/cache bằng negation pattern "!" trong path (input exclude không tồn tại ở v4 này)
          - app: storefront
            artifact_path: |
              apps/storefront/.next
              apps/storefront/public
              !apps/storefront/.next/cache/**
          - app: admin
            artifact_path: apps/admin/dist
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # Dùng @emc/ prefix vì package name trong package.json là @emc/storefront, @emc/admin
      - name: Build @emc/${{ matrix.app }}
        run: npx turbo run build --filter=@emc/${{ matrix.app }}...

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          # Bắt buộc: .next là thư mục hidden, v4.4+ loại trừ hidden files theo mặc định
          include-hidden-files: true
          retention-days: 3

  # ============================================================
  # JOB 5: Security audit — chặn dependency có lỗ hổng nghiêm trọng
  # ============================================================
  security-audit:
    name: Security Audit
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TruffleHog cần full history để quét git secrets

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # Chặn merge nếu production dependency có lỗ hổng mức high/critical.
      # --omit=dev: các lỗ hổng trong dev tooling (vd: @lhci/cli) không vào
      # production bundle nên không chặn merge; production deps vẫn audit nghiêm ngặt.
      - name: npm audit (fail on high/critical in production deps)
        run: npm audit --omit=dev --audit-level=high

      # Pin version cụ thể — không dùng @main để tránh breaking changes bất ngờ
      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          extra_args: --only-verified

  # ============================================================
  # JOB 6: Docker Build & Verification
  # Dockerfile tự build từ source (multi-stage) → không cần chờ job build
  # ============================================================
  docker-build:
    name: Docker Build (${{ matrix.app }})
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [storefront, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.app }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}/Dockerfile
          push: false
          tags: emc-${{ matrix.app }}:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Docker Container (${{ matrix.app }})
        run: |
          # Storefront (Next.js) lắng nghe trên port 3000; admin (nginx) trên port 80
          PORT_MAP=$([ "${{ matrix.app }}" = "storefront" ] && echo "8080:3000" || echo "8080:80")

          # Start container
          docker run -d --name test-${{ matrix.app }} -p ${PORT_MAP} emc-${{ matrix.app }}:test

          # Retry loop — chờ container ready tối đa 30 giây thay vì sleep cứng
          echo "Đang chờ container emc-${{ matrix.app }} khởi động..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Healthcheck thành công sau ${i}x2 giây"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "::error::Healthcheck timeout sau 30 giây cho emc-${{ matrix.app }}"
              docker logs test-${{ matrix.app }}
              docker rm -f test-${{ matrix.app }}
              exit 1
            fi
            sleep 2
          done

          # Check root page returns 200 OK
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Trang chính trả về status ${HTTP_STATUS} thay vì 200 cho emc-${{ matrix.app }}"
            docker logs test-${{ matrix.app }}
            docker rm -f test-${{ matrix.app }}
            exit 1
          fi

          echo "Container emc-${{ matrix.app }} hoạt động hoàn hảo!"

          # Cleanup
          docker rm -f test-${{ matrix.app }}

  # ============================================================
  # JOB 7: SEO Check — assert SEO contract trên bản build thật
  # Kiểm tra title/description/canonical/OG/JSON-LD/robots/sitemap
  # ============================================================
  seo-check:
    name: SEO Check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Download storefront build
        uses: actions/download-artifact@v4
        with:
          name: build-storefront
          path: apps/storefront
          # Ép dùng GitHub REST API (actions/artifact internal path không tìm thấy
          # artifact upload từ matrix job khác). Cần actions: read (đã cấp ở trên).
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Start storefront server
        run: npx next start apps/storefront -p 3000 &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      # Chặn merge nếu thiếu title/description/canonical/OG/JSON-LD/robots/sitemap
      - name: Run SEO assertions
        run: node scripts/seo-check.mjs
        env:
          BASE_URL: http://localhost:3000
          SITE_URL: https://emc.example.com
          SEO_ROUTES: /

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo-report/
          retention-days: 7

  # ============================================================
  # JOB 8: Lighthouse CI — đo SEO score + Core Web Vitals thật
  # ============================================================
  lighthouse:
    name: Lighthouse (SEO & Performance)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Download storefront build
        uses: actions/download-artifact@v4
        with:
          name: build-storefront
          path: apps/storefront
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Install Chromium for Lighthouse
        run: npx playwright install --with-deps chromium

      - name: Resolve Chromium path
        id: chrome-path
        run: |
          CHROME=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chromium*' | head -1)
          echo "path=${CHROME}" >> "$GITHUB_OUTPUT"

      - name: Run Lighthouse CI
        run: npx lhci autorun --config=./lighthouserc.js
        env:
          # Dùng Chromium của Playwright (đã cài cùng system deps) để tránh
          # phụ thuộc vào Chrome download riêng của puppeteer
          CHROME_PATH: ${{ steps.chrome-path.outputs.path }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14

  # ============================================================
  # JOB 9: Gatekeeper — job tổng hợp, dùng làm "required status check" duy nhất
  # Branch protection chỉ cần trỏ vào job này
  # E2E chạy riêng trong workflow e2e.yml — không nằm trong CI để không chặn merge
  # ============================================================
  all-checks-passed:
    name: All Checks Passed
    if: always()
    needs: [lint, typecheck, test, build, security-audit, docker-build, seo-check, lighthouse]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "=== Job Results ==="
          echo "lint:           ${{ needs.lint.result }}"
          echo "typecheck:      ${{ needs.typecheck.result }}"
          echo "test:           ${{ needs.test.result }}"
          echo "build:          ${{ needs.build.result }}"
          echo "security-audit: ${{ needs.security-audit.result }}"
          echo "docker-build:   ${{ needs.docker-build.result }}"
          echo "seo-check:      ${{ needs.seo-check.result }}"
          echo "lighthouse:     ${{ needs.lighthouse.result }}"
          echo "==================="

          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "::error::Một hoặc nhiều job đã fail. Chặn merge."
            exit 1
          fi
          echo "Tất cả các kiểm tra đã pass."