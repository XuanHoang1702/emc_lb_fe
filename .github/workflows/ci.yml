name: CI

# Chạy trên mọi PR hướng vào main/develop và mọi push vào main/develop
# Không cho phép bỏ qua bước nào — mọi job đều bắt buộc (required check trên GitHub)
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Huỷ các lần chạy cũ hơn của cùng 1 PR khi có commit mới, tránh lãng phí runner
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Quyền tối thiểu — nguyên tắc least privilege
permissions:
  contents: read
  actions: write # cần để upload/download build artifact giữa các job (download-artifact@v4 cần actions: read)
  pull-requests: write # để comment coverage report lên PR

env:
  NODE_VERSION: '20.x'
  # Bắt buộc CI fail nếu có warning khi build (không cho "warning trôi qua")
  CI: true

jobs:
  # ============================================================
  # JOB 0: Cài đặt dependencies và cache
  # ============================================================
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần full history để turbo tính affected chính xác

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (frozen lockfile — không cho tự ý update)
        run: npm ci

      # Cache Turbo với key thống nhất để downstream jobs restore được
      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

  # ============================================================
  # JOB 1: Lint — ESLint + Prettier check
  # Zero warnings allowed
  # ============================================================
  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # --max-warnings 0: bất kỳ warning nào cũng làm fail job, không riêng error
      - name: ESLint (zero warnings policy)
        run: npx turbo run lint -- --max-warnings=0

      - name: Prettier format check
        run: npm run format:check

      - name: Check for banned patterns (console.log, debugger, .only trong test)
        run: |
          if grep -rn --include="*.ts" --include="*.tsx" \
            -E "console\.(log|debug)|debugger;|\.only\(" \
            --exclude-dir={node_modules,dist,.next,.turbo} apps/ packages/ 2>/dev/null; then
            echo "::error::Phát hiện console.log/debugger/.only còn sót lại trong code. Chặn merge."
            exit 1
          fi

  # ============================================================
  # JOB 2: Type check — strict mode, không cho phép 'any' ngầm
  # ============================================================
  typecheck:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # tsconfig bật: strict, noUnusedLocals, noUnusedParameters, noUncheckedIndexedAccess
      - name: TypeScript strict check
        run: npx turbo run type-check

  # ============================================================
  # JOB 3: Unit + Integration test — coverage threshold cứng
  # Vitest built-in coverage thresholds — fail nếu dưới ngưỡng
  # ============================================================
  test:
    name: Unit & Integration Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # Chạy test + coverage cho toàn bộ monorepo
      # Coverage thresholds được enforce trong vitest.config.ts của mỗi package
      - name: Run tests with coverage
        run: npx turbo run test -- --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/*/coverage/
            packages/*/coverage/
          retention-days: 7

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request' && success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Coverage report')
            );
            const body = 'Coverage report đã pass ngưỡng tối thiểu (statements 80%, branches 75%, functions 80%, lines 80%).';
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  # ============================================================
  # JOB 4: Build — đảm bảo build production thành công, không warning
  # ============================================================
  build:
    name: Build (${{ matrix.app }})
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [storefront, admin]
        include:
          # Storefront build ra .next (Next.js), admin build ra dist (Vite)
          # Upload nhiều path để LCA = apps/storefront, artifact giữ cấu trúc .next/ và public/
          # (giống e2e.yml) — nếu upload 1 path, .next bị flatten và next start không tìm thấy build
          # Loại trừ .next/cache bằng negation pattern "!" trong path (input exclude không tồn tại ở v4 này)
          - app: storefront
            artifact_path: |
              apps/storefront/.next
              apps/storefront/public
              !apps/storefront/.next/cache/**
          - app: admin
            artifact_path: apps/admin/dist
    steps:
      - uses: actions/checkout@v4

      # Bảo vệ matrix: nếu thêm app mới (vd: seller-portal) mà quên khai báo
      # trong build/docker-build, CI phải fail chứ không im lặng bỏ qua.
      - name: Verify all apps are covered by the build matrix
        run: |
          MATRIX_APPS="storefront admin"
          MISSING=""
          for app_dir in apps/*/; do
            name=$(basename "$app_dir")
            case " $MATRIX_APPS " in
              *" $name "*) ;;
              *) MISSING="$MISSING $name" ;;
            esac
          done
          if [ -n "$MISSING" ]; then
            echo "::error::App mới chưa khai báo trong matrix build/docker-build:${MISSING}. Thêm vào ci.yml (build + docker-build + all-checks-passed) trước khi merge."
            exit 1
          fi
          echo "Mọi app trong apps/ đều có trong matrix build."

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # Dùng @emc/ prefix vì package name trong package.json là @emc/storefront, @emc/admin
      - name: Build @emc/${{ matrix.app }}
        run: npx turbo run build --filter=@emc/${{ matrix.app }}...

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.app }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          # Bắt buộc: .next là thư mục hidden, v4.4+ loại trừ hidden files theo mặc định
          include-hidden-files: true
          retention-days: 3

  # ============================================================
  # JOB 5: Security audit — chặn dependency có lỗ hổng nghiêm trọng
  # ============================================================
  security-audit:
    name: Security Audit
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # TruffleHog cần full history để quét git secrets

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # Chặn merge nếu production dependency có lỗ hổng mức high/critical.
      # --omit=dev: các lỗ hổng trong dev tooling (vd: @lhci/cli) không vào
      # production bundle nên không chặn merge; production deps vẫn audit nghiêm ngặt.
      - name: npm audit (fail on high/critical in production deps)
        run: npm audit --omit=dev --audit-level=high

      # Pin version cụ thể — không dùng @main để tránh breaking changes bất ngờ
      - name: Scan for hardcoded secrets
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          extra_args: --only-verified

  # ============================================================
  # JOB 6: Docker Build & Verification
  # Dockerfile tự build từ source (multi-stage) → không cần chờ job build
  # ============================================================
  docker-build:
    name: Docker Build (${{ matrix.app }})
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        app: [storefront, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (${{ matrix.app }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}/Dockerfile
          push: false
          tags: emc-${{ matrix.app }}:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Test Docker Container (${{ matrix.app }})
        run: |
          # Storefront (Next.js) lắng nghe trên port 3000; admin (nginx) trên port 80
          PORT_MAP=$([ "${{ matrix.app }}" = "storefront" ] && echo "8080:3000" || echo "8080:80")

          # Start container
          docker run -d --name test-${{ matrix.app }} -p ${PORT_MAP} emc-${{ matrix.app }}:test

          # Retry loop — chờ container ready tối đa 30 giây thay vì sleep cứng
          echo "Đang chờ container emc-${{ matrix.app }} khởi động..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Healthcheck thành công sau ${i}x2 giây"
              break
            fi
            if [ "$i" -eq 15 ]; then
              echo "::error::Healthcheck timeout sau 30 giây cho emc-${{ matrix.app }}"
              docker logs test-${{ matrix.app }}
              docker rm -f test-${{ matrix.app }}
              exit 1
            fi
            sleep 2
          done

          # Check root page returns 200 OK
          HTTP_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080/)
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Trang chính trả về status ${HTTP_STATUS} thay vì 200 cho emc-${{ matrix.app }}"
            docker logs test-${{ matrix.app }}
            docker rm -f test-${{ matrix.app }}
            exit 1
          fi

          echo "Container emc-${{ matrix.app }} hoạt động hoàn hảo!"

          # Cleanup
          docker rm -f test-${{ matrix.app }}

  # ============================================================
  # JOB 7: SEO Check — assert SEO contract trên bản build thật
  # Kiểm tra title/description/canonical/OG/JSON-LD/robots/sitemap
  # ============================================================
  seo-check:
    name: SEO Check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Download storefront build
        uses: actions/download-artifact@v4
        with:
          name: build-storefront
          path: apps/storefront
          # Ép dùng GitHub REST API (actions/artifact internal path không tìm thấy
          # artifact upload từ matrix job khác). Cần actions: read (đã cấp ở trên).
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Start storefront server
        run: npx next start apps/storefront -p 3000 &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      # Chặn merge nếu thiếu title/description/canonical/OG/JSON-LD/robots/sitemap
      - name: Run SEO assertions
        run: node scripts/seo-check.mjs
        env:
          BASE_URL: http://localhost:3000
          SITE_URL: https://emc.example.com
          SEO_ROUTES: /

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo-report/
          retention-days: 7

  # ============================================================
  # JOB 8: Lighthouse CI — đo SEO score + Core Web Vitals thật
  # ============================================================
  lighthouse:
    name: Lighthouse (SEO & Performance)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Check for storefront/asset changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - 'apps/storefront/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'lighthouserc.js'

      - name: No frontend changes — skip Lighthouse
        if: steps.changes.outputs.frontend == 'false'
        run: echo "Không có thay đổi liên quan route/asset — bỏ qua Lighthouse."

      - name: Download storefront build
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-storefront
          path: apps/storefront
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Install Chromium for Lighthouse
        if: steps.changes.outputs.frontend == 'true'
        run: npx playwright install --with-deps chromium

      - name: Resolve Chromium path
        if: steps.changes.outputs.frontend == 'true'
        id: chrome-path
        run: |
          CHROME=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chromium*' | head -1)
          echo "path=${CHROME}" >> "$GITHUB_OUTPUT"

      # Lighthouse 6-7 phút/lần. Chỉ chạy full 3 runs trên PR vào main và push main;
      # PR/push vào develop chạy bản rút gọn 1 run để vẫn bắt regression nhanh.
      - name: Determine Lighthouse run count
        id: runs
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "count=3" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.base_ref }}" = "main" ]; then
            echo "count=3" >> "$GITHUB_OUTPUT"
          else
            echo "count=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Lighthouse CI (${{ steps.runs.outputs.count }} run(s))
        if: steps.changes.outputs.frontend == 'true'
        run: npx lhci autorun --config=./lighthouserc.js --collect.numberOfRuns=${{ steps.runs.outputs.count }}
        env:
          # Dùng Chromium của Playwright (đã cài cùng system deps) để tránh
          # phụ thuộc vào Chrome download riêng của puppeteer
          CHROME_PATH: ${{ steps.chrome-path.outputs.path }}

      - name: Upload Lighthouse report
        if: always() && steps.changes.outputs.frontend == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          retention-days: 14

  # ============================================================
  # JOB 9: Architecture & Import-Rule Validation
  # Chặn vi phạm FSD (layer direction, slice isolation, cross-app import)
  # bằng dependency-cruiser — đúng checklist "Is the architectural rule
  # enforced automatically in CI?" (architecture doc §7, "Architecture Checklist").
  # ============================================================
  architecture:
    name: Architecture (FSD Import Rules)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-

      # dependency-cruiser đọc dependency-cruiser.config.cjs ở root;
      # fail với exit code != 0 nếu vi phạm layer/slice/app boundary
      - name: Validate dependency graph (FSD)
        run: npx turbo run depgraph

  # ============================================================
  # JOB 10: Bundle-size monitoring
  # Chặn main JS bundle phình to bất thường khi thêm dependency vào
  # packages/ui, packages/utils hay các app (performance budget §17).
  # ============================================================
  bundle-size:
    name: Bundle Size Check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Download storefront build
        uses: actions/download-artifact@v4
        with:
          name: build-storefront
          path: apps/storefront
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download admin build
        uses: actions/download-artifact@v4
        with:
          name: build-admin
          path: apps/admin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Run bundle size assertions
        run: node scripts/bundle-size-check.mjs

  # ============================================================
  # JOB 9: Critical Path E2E — checkout & payment PHẢI pass trên mọi PR/push
  # Architecture doc §7 & §12: payment/checkout là vùng rủi ro cao, cần CI gate
  # nghiêm ngặt hơn. Không retry — flaky dù 1 lần là fail để điều tra ngay.
  # Full multi-browser E2E (e2e.yml) vẫn chạy riêng trên main.
  # ============================================================
  e2e-critical:
    name: Critical Path E2E (Checkout & Payment)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Download storefront build
        uses: actions/download-artifact@v4
        with:
          name: build-storefront
          path: apps/storefront
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start storefront server
        run: npx next start apps/storefront -p 4173 &

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:4173 --timeout 60000

      # Không retry: checkout/payment flaky = fail ngay, không che giấu bug.
      # --forbid-only: cấm test.only() sót lại trong code.
      - name: Run checkout & payment E2E (no retries allowed)
        run: >
          npx playwright test
          --project=chromium
          --grep="@critical"
          --forbid-only
          --retries=0
          --workers=1
          --reporter=github
        env:
          BASE_URL: http://localhost:4173
          CI: true
          PAYMENT_GATEWAY_MODE: sandbox

      - name: Upload critical path report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-critical-path-report
          path: test-results/
          retention-days: 14

  # ============================================================
  # JOB 10: Gatekeeper — job tổng hợp, dùng làm "required status check" duy nhất
  # Branch protection chỉ cần trỏ vào job này
  # Full multi-browser E2E chạy riêng trong workflow e2e.yml (main PRs + nightly)
  # ============================================================
  all-checks-passed:
    name: All Checks Passed
    if: always()
    needs:
      [
        lint,
        typecheck,
        test,
        build,
        security-audit,
        docker-build,
        seo-check,
        lighthouse,
        architecture,
        bundle-size,
        e2e-critical,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "=== Job Results ==="
          echo "lint:             ${{ needs.lint.result }}"
          echo "typecheck:        ${{ needs.typecheck.result }}"
          echo "test:             ${{ needs.test.result }}"
          echo "build:            ${{ needs.build.result }}"
          echo "security-audit:   ${{ needs.security-audit.result }}"
          echo "docker-build:     ${{ needs.docker-build.result }}"
          echo "seo-check:        ${{ needs.seo-check.result }}"
          echo "lighthouse:       ${{ needs.lighthouse.result }}"
          echo "architecture:     ${{ needs.architecture.result }}"
          echo "bundle-size:      ${{ needs.bundle-size.result }}"
          echo "e2e-critical:     ${{ needs.e2e-critical.result }}"
          echo "==================="

          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
            echo "::error::Một hoặc nhiều job đã fail. Chặn merge."
            exit 1
          fi
          echo "Tất cả các kiểm tra đã pass."